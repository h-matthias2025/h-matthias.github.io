<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ page.title | default: site.title }} — {{ site.title }}</title>

  <!-- Google fonts used in the example - optional -->
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;700&family=Source+Sans+3:wght@300;600&display=swap" rel="stylesheet">

  <meta name="description" content="{{ page.excerpt | strip_html | strip_newlines | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <div class="site-root">
    {% include sidebar.html %}
    <div class="main-column">
      <header class="topbar">
        <div class="wrap">
          <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
          <p class="site-desc">{{ site.description }}</p>
        </div>
      </header>

      <main class="wrap content-area">
        {{ content }}
      </main>

      {% include footer.html %}
    </div>
  </div>
</body>
</html>
